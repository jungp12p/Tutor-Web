<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Class Portal</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="page">
      <h1 class="page-title">Class Portal</h1>
      <div class="card" role="application" aria-label="Class portal">
        <section id="selectionView" class="selection-view" aria-label="Tutor selection view">
          <h2 class="selection-title">Choose A Tutor Group</h2>
          <!-- tutor buttons -->
          <div class="tutor-grid" id="tutorGrid" aria-hidden="false"></div>
        </section>

        <section id="sessionView" class="session-view hidden" aria-label="Tutor session view">
          <div class="session-header">
            <button id="backBtn" class="back-btn" type="button" aria-label="Back to tutor list">
              <img src="back-button.png" alt="Back" class="back-btn-image" />
            </button>
            <h2 id="activeTutorName" class="active-tutor-name">Tutor Session</h2>
          </div>

          <!-- video player -->
          <div class="video-area">
            <div class="video-player">
              <iframe
                id="mainVideo"
                src=""
                allow="autoplay; fullscreen"
                allowfullscreen
                webkitallowfullscreen
                mozallowfullscreen
                title="Class video player"></iframe>
            </div>
          </div>

          <!-- Zoom control -->
          <div class="controls">
            <button id="zoomJoinBtn" disabled aria-disabled="true">Join Zoom Session</button>
          </div>
        </section>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
