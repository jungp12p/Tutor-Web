<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Class Portal</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="page">
      <div class="card" role="application" aria-label="Class portal">
        <div class="header">
          <div>
            <h1>Class Portal</h1>
          </div>
        </div>

        <!-- tutor buttons -->
        <div class="tutor-grid" id="tutorGrid" aria-hidden="false">
        </div>

        <!-- video player -->
        <div class="video-area">
          <div class="video-player">
            <iframe
              id="mainVideo"
              src=""
              allow="autoplay; fullscreen"
              allowfullscreen
              webkitallowfullscreen
              mozallowfullscreen
              title="Class video player"></iframe>
          </div>
        </div>

        <!-- Zoom control -->
        <div class="controls">
          <button id="zoomJoinBtn" disabled aria-disabled="true">Join Zoom Session</button>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
